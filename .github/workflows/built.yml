name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Embutir modelo de voz em mandarim (Vosk small-cn, ~42 MB)
        run: |
          curl -L --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip
          unzip -q model.zip
          rm -rf app/src/main/assets/model-cn
          mkdir -p app/src/main/assets
          mv vosk-model-small-cn-0.22 app/src/main/assets/model-cn
          uuidgen > app/src/main/assets/model-cn/uuid

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk TradutorZH-PT.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TradutorZH-PT-apk
          path: TradutorZH-PT.apk
